<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A-Voentorg</title>
    
    <!-- CSS Frameworks -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="h-screen overflow-hidden flex flex-col bg-gray-100 font-sans">

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="fixed top-5 left-5 right-5 md:left-auto md:right-5 z-[70] flex flex-col gap-2 pointer-events-none"></div>

    <!-- Modals (Admin Inventory) -->
    <div id="modal-overlay" class="fixed inset-0 z-[60] bg-black bg-opacity-50 hidden flex items-end md:items-center justify-center p-0 md:p-4 backdrop-blur-sm transition-opacity duration-300">
        <!-- Content injected by JS -->
    </div>

    <!-- Auth Screen -->
    <div id="auth-screen" class="fixed inset-0 z-[50] bg-white flex items-center justify-center transition-all duration-500 px-4">
        <div class="w-full max-w-md p-8 bg-white shadow-2xl rounded-xl border-t-4 border-[#c1a270]">
            <h1 class="text-3xl font-bold text-gray-800 text-center mb-2">A-Voentorg</h1>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Позывной</label>
                    <input type="text" id="login-username" class="mt-1 block w-full px-3 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#c1a270] outline-none transition text-lg" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Пароль</label>
                    <input type="password" id="login-password" class="mt-1 block w-full px-3 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#c1a270] outline-none transition text-lg" required>
                </div>
                <button type="submit" class="w-full py-4 px-4 bg-[#c1a270] hover:bg-[#a68a5a] text-white rounded-lg font-bold text-lg transition-all shadow-lg hover:shadow-xl mt-4">
                    Авторизация
                </button>
            </form>
            <p id="auth-error" class="mt-4 text-center text-red-600 text-sm hidden animate-pulse"></p>
        </div>
    </div>

    <!-- Main App Interface -->
    <div id="app-interface" class="flex h-full hidden opacity-0 transition-opacity duration-500">
        
        <!-- Sidebar (Desktop) -->
        <aside class="w-64 bg-white shadow-xl z-30 hidden md:flex flex-col h-full border-r border-gray-200">
            <div class="p-6 border-b border-gray-100 flex items-center gap-2">
                <i data-lucide="shield" class="text-[#c1a270] w-8 h-8"></i>
                <span class="text-xl font-bold tracking-wider">Voentorg</span>
            </div>
            
            <nav class="flex-1 overflow-y-auto py-4">
                <ul class="space-y-1 px-3" id="desktop-nav">
                    <!-- Nav generated by JS -->
                </ul>
            </nav>

            <div class="p-4 border-t border-gray-100 bg-gray-50">
                <div class="mb-3">
                    <p class="text-xs text-gray-500 uppercase font-bold">Баланс</p>
                    <div class="flex items-baseline gap-1">
                        <span id="sidebar-balance" class="text-xl font-bold text-gray-800">0.00</span>
                        <span class="text-xs font-bold text-[#c1a270]">AC</span>
                    </div>
                </div>
                <button id="logout-btn" class="w-full flex items-center justify-center gap-2 px-4 py-2 text-sm text-red-600 border border-red-200 rounded-lg hover:bg-red-50 transition-colors">
                    <i data-lucide="log-out" class="w-4 h-4"></i> Выход
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 h-full overflow-hidden bg-[#f3f4f6] relative flex flex-col">
            <!-- Mobile Header (Balance & Logout) -->
            <div class="md:hidden bg-white px-4 py-3 shadow-sm flex justify-between items-center z-20 flex-shrink-0 border-b border-gray-200">
                <div class="flex items-center gap-2">
                    <i data-lucide="shield" class="text-[#c1a270] w-6 h-6"></i>
                    <span class="font-bold text-gray-800 tracking-wide">Voentorg</span>
                </div>
                <div class="flex items-center gap-3">
                    <div class="text-right">
                        <span id="mobile-balance" class="font-bold text-gray-800 block leading-none text-lg">0</span>
                        <span class="text-[10px] text-[#c1a270] font-bold uppercase">AC Balance</span>
                    </div>
                    <button onclick="App.authService.logout()" class="text-gray-400 hover:text-red-600 p-1">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- Scrollable Content -->
            <div id="content-scroll-wrapper" class="flex-1 overflow-y-auto overflow-x-hidden">
                <div id="content-area" class="p-4 md:p-8 max-w-7xl mx-auto min-h-full">
                    <!-- Content injected by JS -->
                </div>
            </div>
        </main>

        <!-- Mobile Nav (Bottom Bar) -->
        <div class="md:hidden fixed bottom-0 left-0 right-0 bg-white shadow-[0_-4px_20px_rgba(0,0,0,0.1)] z-40 flex justify-around items-center px-2 py-2 border-t border-gray-100 safe-area-pb" id="mobile-nav">
            <!-- Mobile nav generated by JS -->
        </div>
    </div>

    <!-- Init Script -->
    <script type="module" src="./js/app.js"></script>
</body>
</html>
