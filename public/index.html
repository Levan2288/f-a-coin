<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-Voentorg</title>
    
    <!-- CSS Frameworks -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="h-screen overflow-hidden flex flex-col bg-gray-100 font-sans">

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Modals (Admin Inventory) -->
    <div id="modal-overlay" class="fixed inset-0 z-[60] bg-black bg-opacity-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <!-- Content injected by JS -->
    </div>

    <!-- Auth Screen -->
    <div id="auth-screen" class="fixed inset-0 z-40 bg-white flex items-center justify-center transition-all duration-500">
        <div class="w-full max-w-md p-8 bg-white shadow-2xl rounded-xl border-t-4 border-[#c1a270]">
            <h1 class="text-3xl font-bold text-gray-800 text-center mb-2">A-COIN <span class="text-[#c1a270]">SYSTEM</span></h1>
            <p class="text-center text-gray-500 mb-8">Secure Access Terminal</p>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Позывной</label>
                    <input type="text" id="login-username" class="mt-1 block w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-md focus:ring-2 focus:ring-[#c1a270] outline-none transition" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Пароль</label>
                    <input type="password" id="login-password" class="mt-1 block w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-md focus:ring-2 focus:ring-[#c1a270] outline-none transition" required>
                </div>
                <button type="submit" class="w-full py-3 px-4 bg-[#c1a270] hover:bg-[#a68a5a] text-white rounded-md font-medium transition-all shadow-lg hover:shadow-xl">
                    Авторизация
                </button>
            </form>
            <p id="auth-error" class="mt-4 text-center text-red-600 text-sm hidden animate-pulse"></p>
        </div>
    </div>

    <!-- Main App Interface -->
    <div id="app-interface" class="flex h-full hidden opacity-0 transition-opacity duration-500">
        
        <!-- Sidebar -->
        <aside class="w-64 bg-white shadow-xl z-30 hidden md:flex flex-col h-full">
            <div class="p-6 border-b border-gray-100 flex items-center gap-2">
                <i data-lucide="shield" class="text-[#c1a270] w-8 h-8"></i>
                <span class="text-xl font-bold tracking-wider">ARMORY</span>
            </div>
            
            <nav class="flex-1 overflow-y-auto py-4">
                <ul class="space-y-1 px-3" id="desktop-nav">
                    <!-- Nav generated by JS -->
                </ul>
            </nav>

            <div class="p-4 border-t border-gray-100 bg-gray-50">
                <div class="mb-3">
                    <p class="text-xs text-gray-500 uppercase font-bold">Баланс</p>
                    <div class="flex items-baseline gap-1">
                        <span id="sidebar-balance" class="text-xl font-bold text-gray-800">0.00</span>
                        <span class="text-xs font-bold text-[#c1a270]">AC</span>
                    </div>
                </div>
                <button id="logout-btn" class="w-full flex items-center justify-center gap-2 px-4 py-2 text-sm text-red-600 border border-red-200 rounded-lg hover:bg-red-50 transition-colors">
                    <i data-lucide="log-out" class="w-4 h-4"></i> Выход
                </button>
            </div>
        </aside>

        <!-- Mobile Nav -->
        <div class="md:hidden fixed bottom-0 left-0 right-0 bg-white shadow-[0_-4px_15px_rgba(0,0,0,0.1)] z-50 flex justify-around p-3 border-t" id="mobile-nav">
            <!-- Mobile nav generated by JS -->
        </div>

        <!-- Main Content -->
        <main class="flex-1 h-full overflow-y-auto bg-[#f3f4f6] relative">
            <div id="content-area" class="p-4 md:p-8 pb-24 md:pb-8 max-w-7xl mx-auto min-h-full">
                <!-- Content injected by JS -->
            </div>
        </main>
    </div>

    <!-- Init Script -->
    <script type="module" src="./js/app.js"></script>
</body>
</html>
